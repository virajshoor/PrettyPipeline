[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prettypipeline-ocr"
version = "0.4.0"
description = "Turn PDFs into structured JSON with local OCR, GPT vision, and training exports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "greatshoor" }]
keywords = ["ocr", "pdf", "llm", "extraction", "json"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pymupdf>=1.24",
    "openai>=1.0",
    "pillow",
]

[project.optional-dependencies]
ocr = [
    "transformers>=4.57.1,<5",
    "torch",
    "torchvision",
    "einops",
    "addict",
    "easydict",
    "safetensors",
    "tqdm",
    "matplotlib",
    "requests",
]
dev = [
    "pytest>=8",
    "build",
    "twine",
    "transformers>=4.57.1,<5",
    "torch",
    "torchvision",
    "einops",
    "addict",
    "easydict",
    "safetensors",
    "tqdm",
    "matplotlib",
    "requests",
]

[project.urls]
Homepage = "https://github.com/virajshoor/PrettyPipeline"
Repository = "https://github.com/virajshoor/PrettyPipeline"
Issues = "https://github.com/virajshoor/PrettyPipeline/issues"
PyPI = "https://pypi.org/project/prettypipeline-ocr/"

[project.scripts]
prettypipeline = "prettypipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
